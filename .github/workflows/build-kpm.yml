name: Build CI

# Legacy build remains available manually, but does not double-build on every push.
on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Push a new release'
        required: false
        default: 'false'
      version:
        description: 'release version'
        required: false
        default: '2024051900'

# Share build concurrency with the SukiSU preflight workflow.
concurrency:
  group: kpm-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  Build-on-Ubuntu:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TZ: UTC-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Update system and install dependencies
        run: |
          sudo apt update -y

      - name: Restore GCC cross-toolchain from cache
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf
          key: toolchain-aarch64-none-elf-12.2.rel1-ubuntu-x64-v1

      - name: Install Compiler (cache miss only)
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: |
          curl -fL --retry 3 -o toolchain.tar.xz https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -Jxf toolchain.tar.xz
          rm -f toolchain.tar.xz

      - name: Restore compiler object cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: legacy-kpm-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            legacy-kpm-ccache-${{ runner.os }}-${{ github.ref_name }}-
            legacy-kpm-ccache-${{ runner.os }}-

      - name: Install ccache
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache
          ccache --max-size=256M

      - name: Build kpm
        env:
          TARGET_COMPILE: ${{ github.workspace }}/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin/aarch64-none-elf-
        run: |
          mkdir target

          for dir in $(ls -d */ | grep -v '^KernelPatch/$\|^target/$\|^arm-gnu-toolchain'); do
            make -C ${dir} CC="ccache ${TARGET_COMPILE}gcc"
            mv ${dir}*.kpm target
          done

      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true

      - name: Upload artifact
        if: success()
        uses: lzghzr/upload-artifact@405e6269d5b1feb22bf2a044deb7950596bed6da
        with:
          path: "target/*.kpm"
          artifact-per-file: true
          artifact-name-rule: ${name}

      - name: Upload release
        if: github.event.inputs.release == 'true' && success() && !cancelled()
        uses: ncipollo/release-action@v1.14.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ github.event.inputs.version }}
          tag: ${{ github.event.inputs.version }}
          body: This release is built by github-action.
          artifacts: "target/*.kpm"
          allowUpdates: true
          makeLatest: true
          omitBodyDuringUpdate: true
          replacesArtifacts: true